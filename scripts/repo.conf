# shellcheck shell=bash disable=SC2034 # the variables are read by the scripts that source this
# Per-repository settings, sourced by the scripts in this directory.
# This file holds every per-repository setting of the tooling.

# Module path prefix: every module here is <MODULE_PREFIX>/<group>/<module>, living in the
# directory <group>/<module> (a group directory itself carries no go.mod).
REPO_NAME=libs
MODULE_PREFIX=github.com/hollis-labs/libs

# One-way dependency rule: space-separated module path prefixes that nothing in
# this repository may reference (go.mod, go.sum or imports). Empty means no limit.
# substrate may depend on libs, so it forbids nothing; libs forbids substrate.
FORBIDDEN_PREFIXES="github.com/hollis-labs/substrate"

# Groups and their dependency rank, as group:rank pairs. A module may depend on modules of
# its own group (no cycles) and on groups of strictly lower rank, never on a higher rank.
# Groups of equal rank are siblings and may not depend on each other:
#   core < security < mcp, ui, workflow, llm < mesh < agent
GROUP_RANKS="core:0 security:1 mcp:2 ui:2 workflow:2 llm:2 mesh:3 agent:4"

# TRANSITIONAL. Top-level modules that predate the group layout (<dir>/go.mod). They are
# tolerated by check-layout, checked and released under their old names, and ignored by the
# group rank rule. Empty this list when the last one has moved into a group.
LEGACY_FLAT_MODULES=""
