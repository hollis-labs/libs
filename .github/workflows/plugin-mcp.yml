# Checks for the plugin-mcp module only; runs when its files (or the shared module workflow) change.
name: plugin-mcp

on:
  push:
    branches: [main]
    paths:
      - "plugin-mcp/**"
      - ".github/workflows/plugin-mcp.yml"
      - ".github/workflows/_module.yml"
  pull_request:
    paths:
      - "plugin-mcp/**"
      - ".github/workflows/plugin-mcp.yml"
      - ".github/workflows/_module.yml"

permissions:
  contents: read

concurrency:
  group: plugin-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/_module.yml
    with:
      module: plugin-mcp
      race: true

  ts:
    name: ts · typecheck · build · test · pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-mcp/plugin-sdk/ts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin-mcp/plugin-sdk/ts/package-lock.json

      # `npm ci` runs plugin-registry's `prepare`, which builds dist/. That is
      # the same path a consumer's install takes, so a break in it is a break
      # for them.
      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      # Build before test: the tests import dist/, which a fresh tree only has
      # because `prepare` built it. `npm test` also builds, but naming the step
      # keeps a build failure from reading as a test failure.
      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: real Node child corpus replay
        run: TMPDIR="$RUNNER_TEMP" node packages/plugin-sdk/test/child-replay.js node

      # The published file list is a property of the package, checked before a
      # human runs `npm publish`, not after.
      - name: pack (dry run)
        run: npm pack --dry-run --workspaces

  ts-node22:
    name: ts · Node 22 · typecheck · build · test · pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-mcp/plugin-sdk/ts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin-mcp/plugin-sdk/ts/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: real Node child corpus replay
        run: TMPDIR="$RUNNER_TEMP" node packages/plugin-sdk/test/child-replay.js node

      - name: pack (dry run)
        run: npm pack --dry-run --workspaces

  ts-deno:
    name: deno · stdio acceptance · transcript replay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-mcp/plugin-sdk/ts
    steps:
      - uses: actions/checkout@v5

      # Node installs/builds the workspace and drives the real Deno child.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin-mcp/plugin-sdk/ts/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      # Only local modules and Node built-ins: no Deno network permission or
      # dependency downloads. npm ci owns dependency installation above.
      - name: real stdio acceptance (Deno child)
        run: node packages/plugin-sdk/test/stdio-acceptance.js deno run --cached-only --no-npm --no-check --allow-env

      - name: shared transcript replay (Deno)
        run: deno test --cached-only --no-npm --no-check --allow-read --allow-env packages/plugin-sdk/test/transcripts.test.js

      - name: real Deno child corpus replay (Node parent)
        run: TMPDIR="$RUNNER_TEMP" node packages/plugin-sdk/test/child-replay.js deno

  sdk-go-child:
    name: SDK Go child replay
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOWORK: "off"
    defaults:
      run:
        working-directory: plugin-mcp/plugin-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugin-mcp/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: install child parent dependencies
        run: npm --prefix ts ci
      - name: build child parent codecs
        run: npm --prefix ts run build
      - name: build Go fixture child
        run: go test -race -c ./subprocess -o "$RUNNER_TEMP/duplex-child"
      - name: Go child corpus replay
        run: TMPDIR="$RUNNER_TEMP" node ts/packages/plugin-sdk/test/child-replay.js go "$RUNNER_TEMP/duplex-child"

  vulnerability:
    name: module vulnerability check
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: plugin-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugin-mcp/go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  host-interop:
    name: host pinned negotiated child
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOWORK: "off"
    defaults:
      run:
        working-directory: plugin-mcp/plugin-host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugin-mcp/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # Test-only normal-Serve fixture source; not the module dependency pin.
      - name: pinned SDK negotiated child
        run: |
          pin=ea8ec0dca862d0c7284cc6a130a4b27fb812ed21
          assets="$RUNNER_TEMP/plugin-host-interop-$pin"
          mkdir -p "$assets"
          fixture="$assets/source"
          git init "$fixture"
          git -C "$fixture" remote add origin https://github.com/hollis-labs/plugin-sdk.git
          git -C "$fixture" fetch --depth=1 origin $pin
          git -C "$fixture" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture" rev-parse HEAD)" = $pin
          (cd "$fixture" && GOWORK=off go test -p 2 -race -c ./subprocess -o "$assets/duplex-child")
          (cd "$fixture/ts" && npm ci --ignore-scripts && npm run build)
          printf '%s\n' "$pin" > "$fixture/.interop-source-commit"
          test "$(sha256sum "$fixture/protocol/v2/fixtures/duplex-child.json" | cut -d' ' -f1)" = 30cb07b87060dc88e9cb6ac5414f7b9cb7bb19c7a97c058e284d96e1e59ff4a9
          printf '%s\n' "$pin|$(go version)|GOMAXPROCS=4|GOFLAGS=-p=2|race=true" > "$assets/build-receipt"
          printf '%s\n' "$pin|$(node --version)|$(npm --version)|npm-ci-ignore-scripts|workspace-build" > "$assets/ts-build-receipt"
          echo "INTEROP_SDK_SOURCE=$fixture" >> "$GITHUB_ENV"
          echo "INTEROP_GO_CHILD=$assets/duplex-child" >> "$GITHUB_ENV"
          echo "INTEROP_HOST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INTEROP_HOST_DIRTY=false" >> "$GITHUB_ENV"
          echo "INTEROP_SDK_BASE=d04ab2149506a96e8c54b58829f58ee480e0de41" >> "$GITHUB_ENV"
          echo "INTEROP_INVENTORY_REPORT=$assets/report.json" >> "$GITHUB_ENV"
          echo "INTEROP_REPORT=$assets/replay-report.json" >> "$GITHUB_ENV"
          echo "INTEROP_CONTROL_REPORT=$assets/control-report.json" >> "$GITHUB_ENV"
          echo "INTEROP_RECEIVED_REPORT=$assets/received-budget-report.json" >> "$GITHUB_ENV"
          echo "INTEROP_OBSERVER_REPORT=$assets/observer-report.json" >> "$GITHUB_ENV"
          echo "INTEROP_AUTHORITY_REPORT=$assets/authority-report.json" >> "$GITHUB_ENV"
          echo "INTEROP_GO_VERSION=$(go version)" >> "$GITHUB_ENV"
          echo "INTEROP_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "INTEROP_DENO_VERSION=$(deno --version | head -1)" >> "$GITHUB_ENV"
          # Current execution/module identity is separate from historical pins
          # retained in the imported test reports.
          git rev-parse HEAD > "$assets/consolidated-execution-head"
          git rev-parse HEAD:plugin-mcp > "$assets/consolidated-module-tree"
          go list -m -json > "$assets/consolidated-go-module.json"
          pwd > "$assets/consolidated-execution-workdir"
          echo "REVERSE_GO_CHILD=$assets/duplex-child" >> "$GITHUB_ENV"
          echo "REVERSE_NODE_WORKER=$fixture/ts/packages/plugin-sdk/test/negotiated-worker.js" >> "$GITHUB_ENV"

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: interop receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-interop-receipts
          path: |
            ${{ runner.temp }}/plugin-host-interop-*/report.json
            ${{ runner.temp }}/plugin-host-interop-*/control-report.json
            ${{ runner.temp }}/plugin-host-interop-*/replay-report.json
            ${{ runner.temp }}/plugin-host-interop-*/received-budget-report.json
            ${{ runner.temp }}/plugin-host-interop-*/observer-report.json
            ${{ runner.temp }}/plugin-host-interop-*/authority-report.json
            ${{ runner.temp }}/plugin-host-interop-*/build-receipt
            ${{ runner.temp }}/plugin-host-interop-*/ts-build-receipt
            ${{ runner.temp }}/plugin-host-interop-*/consolidated-execution-head
            ${{ runner.temp }}/plugin-host-interop-*/consolidated-module-tree
            ${{ runner.temp }}/plugin-host-interop-*/consolidated-go-module.json
            ${{ runner.temp }}/plugin-host-interop-*/consolidated-execution-workdir
