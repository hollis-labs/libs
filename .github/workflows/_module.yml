# Reusable per-module check, called by one small workflow per module (harness.yml, ...).
# Each caller carries the path filter, so a change only runs the modules it touches.
name: module

on:
  workflow_call:
    inputs:
      module:
        description: Module directory, for example mesh
        required: true
        type: string
      race:
        description: Also run the tests with the race detector
        required: false
        type: boolean
        default: true
      sandbox-backend:
        description: Provision the Linux sandbox backend (bubblewrap) before the checks
        required: false
        type: boolean
        default: false
      govulncheck:
        description: Also run govulncheck against the module
        required: false
        type: boolean
        default: false
      postgres:
        description: Start a disposable PostgreSQL server and export STREAMLOG_PG_DSN and GOSTORE_TEST_PG_DSN for the tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.module }}
    runs-on: ubuntu-latest
    env:
      # Never let a go.work leak in: every module builds on its own.
      GOWORK: "off"
    defaults:
      run:
        working-directory: ${{ inputs.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          # A module with no dependencies has no go.sum; go.mod keeps the cache key valid.
          cache-dependency-path: |
            ${{ inputs.module }}/go.mod
            ${{ inputs.module }}/go.sum

      - name: Install Linux sandbox backend
        if: ${{ inputs.sandbox-backend }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2
          # Permit the namespace backend on this disposable hosted runner.
          # This is CI provisioning, not a change to consumer host policy.
          # Ubuntu 24.04 otherwise denies bwrap's loopback setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net -- /bin/true

      - name: Start PostgreSQL
        if: ${{ inputs.postgres }}
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=test -p 127.0.0.1:5432:5432 postgres:17-alpine
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -h 127.0.0.1 && break
            sleep 1
          done
          docker exec pg pg_isready -U postgres -h 127.0.0.1
          echo "STREAMLOG_PG_DSN=host=127.0.0.1 port=5432 user=postgres password=test dbname=postgres sslmode=disable" >> "$GITHUB_ENV"
          # core/store: its harness fails (not skips) without a server when CI is set.
          echo "GOSTORE_TEST_PG_DSN=host=127.0.0.1 port=5432 user=postgres password=test dbname=postgres sslmode=disable" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ${{ inputs.race && '-race' || '' }} ./...

      - name: govulncheck
        if: ${{ inputs.govulncheck }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
