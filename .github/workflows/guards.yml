# Repository-wide guards. No path filter: these protect the layout and the public
# release, so they run on every push to main and every pull request.
name: guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: layout, one-way rules, public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the public-hygiene scan reads the full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/plugin-mcp/go.mod
          cache: false

      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Raw scan and exact-exception boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v

      - name: layout (groups hold modules, no go.work, no replace, one go.mod per module)
        run: scripts/check-layout

      - name: one-way rules (substrate never; group order core < security < mcp/ui/workflow/llm < mesh < harness < agent < app)
        run: scripts/check-one-way

      # Scoped to the revision under test (the pull request's merge commit, or the pushed
      # branch tip): the checkout fetches every branch, and a scan of all refs would charge
      # this change with the history of every other open branch.
      - name: public hygiene (secrets, hosts, private paths; tree and history)
        run: scripts/scan-public --ref HEAD

      - name: scripts parse (shellcheck, python syntax)
        run: |
          shellcheck -x scripts/repo.conf scripts/_common.sh scripts/check scripts/check-layout scripts/check-one-way scripts/changed-modules scripts/release scripts/import-repo
          python3 -c "import ast; ast.parse(open('scripts/scan-public').read())"
