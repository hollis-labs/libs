name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify immutable tag target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
      - name: Run release gates
        run: make check
      - name: Create draft release and publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
